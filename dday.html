<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: #191919; /* 노션 다크모드 배경색 */
    box-sizing: border-box;
  }
  .timer {
    display: flex;
    width: 100%;
    height: 100%;
    padding: 16px;
    gap: 16px;
    box-sizing: border-box;
  }
  .box {
    flex: 1; /* 4개 박스가 가로 폭을 균등하게 꽉 채움 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #2f3437;
    color: #ffffff;
    border-radius: 16px;
  }
  .num {
    font-size: 64px; /* 숫자 크기 대폭 확대 */
    font-weight: bold;
    line-height: 1.1;
  }
  .label {
    font-size: 16px; /* 라벨 크기 확대 */
    opacity: 0.7;
    margin-top: 8px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="timer">
  <div class="box"><div class="num" id="days">0</div><div class="label">DAYS</div></div>
  <div class="box"><div class="num" id="hours">0</div><div class="label">HOURS</div></div>
  <div class="box"><div class="num" id="minutes">0</div><div class="label">MINUTES</div></div>
  <div class="box"><div class="num" id="seconds">0</div><div class="label">SECONDS</div></div>
</div>

<script>
  const targetDate = new Date("Oct 18, 2027 00:00:00").getTime();

  function updateTimer() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) return;

    document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
