<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Lyon-Text, Georgia, "Times New Roman", "Batang", serif; /* 노션 스타일 세리프 폰트 */
    background-color: #191919;
    box-sizing: border-box;
  }
  .timer {
    display: flex;
    width: 100%;
    height: 100%;
    padding: 16px;
    gap: 16px;
    box-sizing: border-box;
  }
  .box {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #2f3437;
    color: #ffffff;
    border-radius: 16px;
  }
  .num {
    font-size: 64px;
    font-weight: bold;
    line-height: 1.1;
  }
  .label {
    font-size: 16px;
    opacity: 0.7;
    margin-top: 8px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="timer">
  <div class="box"><div class="num" id="days">0</div><div class="label">DAYS</div></div>
  <div class="box"><div class="num" id="hours">0</div><div class="label">HOURS</div></div>
  <div class="box"><div class="num" id="minutes">0</div><div class="label">MINUTES</div></div>
  <div class="box"><div class="num" id="seconds">0</div><div class="label">SECONDS</div></div>
</div>

<script>
  const targetDate = new Date("Oct 18, 2027 00:00:00").getTime();

  function updateTimer() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) return;

    document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
